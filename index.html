<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Classic TV Guide & Video Player - Cinema Live Player</title>

  <!-- Preconnect for performance -->
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- HLS.js Library -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.4.0/dist/hls.min.js"></script>

  <style>
    .crt-overlay {
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.3) 50%);
      background-size: 100% 4px;
      pointer-events: none;
    }
    .active-channel-card {
      border-color: #22c55e !important;
      box-shadow: 0 0 15px rgba(34, 197, 94, 0.3);
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans antialiased selection:bg-emerald-500 selection:text-slate-950">

  <!-- Header -->
  <header class="border-b border-slate-800 bg-slate-900/80 backdrop-blur sticky top-0 z-50 px-6 py-4 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <div class="w-4 h-4 rounded-full bg-emerald-500 animate-pulse"></div>
      <h1 class="text-xl font-bold tracking-wide uppercase text-slate-100">Classic TV Virtual Broadcast Network</h1>
    </div>
    <div id="system-clock" class="text-sm font-mono text-slate-400 bg-slate-950 px-3 py-1 rounded border border-slate-800">
      00:00:00 UTC
    </div>
  </header>

  <!-- Main Content Layout -->
  <main class="flex-1 grid grid-cols-1 lg:grid-cols-12 gap-6 p-6 max-w-7xl mx-auto w-full">
    
    <!-- Player Column -->
    <section class="lg:col-span-8 flex flex-col gap-4">
      <!-- Screen Container -->
      <div class="relative aspect-video bg-black rounded-xl overflow-hidden border border-slate-800 shadow-2xl">
        <video id="main-video-player" class="w-full h-full object-contain" playsinline></video>
        
        <!-- CRT Scanline Effect Layer -->
        <div class="absolute inset-0 crt-overlay z-10"></div>

        <!-- Status & Station Overlay -->
        <div class="absolute top-4 left-4 z-20 flex items-center gap-2 bg-slate-950/80 backdrop-blur px-3 py-1.5 rounded-lg border border-slate-800 text-xs font-mono">
          <span id="player-status-dot" class="w-2.5 h-2.5 rounded-full bg-amber-500"></span>
          <span id="player-status-text" class="text-slate-300 font-semibold uppercase">INITIALIZING...</span>
        </div>

        <div class="absolute bottom-4 left-4 right-4 z-20 bg-slate-950/85 backdrop-blur p-4 rounded-lg border border-slate-800 flex justify-between items-center">
          <div>
            <div class="text-xs text-emerald-400 font-mono tracking-wider uppercase mb-0.5">Now Playing</div>
            <div id="current-program-title" class="text-base font-bold text-white">Loading EPG Schedule...</div>
            <div id="current-program-time" class="text-xs text-slate-400 font-mono">--:-- - --:--</div>
          </div>
          <div id="current-channel-badge" class="text-2xl font-black font-mono text-emerald-400 bg-emerald-950/50 px-3 py-1 rounded border border-emerald-800">
            CH 103
          </div>
        </div>
      </div>

      <!-- Controls & Network Information -->
      <div class="bg-slate-900 border border-slate-800 rounded-xl p-4 flex flex-wrap justify-between items-center gap-4">
        <div class="flex items-center gap-2">
          <button id="btn-mute" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-semibold rounded-lg transition border border-slate-700">
            Unmute Audio
          </button>
          <button id="btn-reload" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-semibold rounded-lg transition border border-slate-700">
            Re-Tune Channel
          </button>
        </div>
        <div class="text-xs text-slate-500 font-mono">
          Single-Tuner Engine v2.5 | CORS Proxy: Active
        </div>
      </div>
    </section>

    <!-- Channels & EPG Column -->
    <section class="lg:col-span-4 flex flex-col gap-4">
      <h2 class="text-sm font-bold uppercase tracking-wider text-slate-400 font-mono px-1">
        Station Matrix
      </h2>

      <!-- Channel List Cards -->
      <div id="station-list" class="flex flex-col gap-3">
        <!-- Rendered dynamically via JavaScript -->
      </div>
    </section>

  </main>

  <!-- Application Logic -->
  <script>
    /**
     * Virtual EPG Matrix & Channel Data
     */
    const STATIONS = {
      101: {
        id: 101,
        name: "Classic Westerns",
        tagline: "Have Gun – Will Travel / Bonanza",
        defaultStreamUrl: "https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8",
        programs: [
          { title: "Have Gun – Will Travel", durationMinutes: 60, mediaUrl: "https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8" }
        ]
      },
      102: {
        id: 102,
        name: "Mystery & Crime",
        tagline: "Columbo & Classic Detectives",
        defaultStreamUrl: "https://playertest.longtailvideo.com/adaptive/bipbop/gear4/prog_index.m3u8",
        programs: [
          { title: "Columbo: Ransom for a Dead Man", durationMinutes: 90, mediaUrl: "https://playertest.longtailvideo.com/adaptive/bipbop/gear4/prog_index.m3u8" }
        ]
      },
      103: {
        id: 103,
        name: "Cinema Live Cinema",
        tagline: "24/7 Curated Classic Features",
        defaultStreamUrl: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/TearsOfSteel.mp4",
        programs: [
          { title: "Tears of Steel (Classic Sci-Fi Feature)", durationMinutes: 120, mediaUrl: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/TearsOfSteel.mp4" }
        ]
      },
      104: {
        id: 104,
        name: "Classic TV Comedy",
        tagline: "Hogan's Heroes & Vintage Sitcoms",
        defaultStreamUrl: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4",
        programs: [
          { title: "Hogan's Heroes Block", durationMinutes: 30, mediaUrl: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4" }
        ]
      }
    };

    /**
     * StreamController Class
     * Manages Teardown, CORS/HTTPS, Watchdog Timeouts, and EPG resolution.
     */
    class StreamController {
      constructor(videoElement) {
        this.video = videoElement;
        this.hls = null;
        this.activeStationId = null;
        this.currentSessionId = 0;
        this.watchdogTimer = null;
        this.watchdogTimeoutMs = 8000; // 8 second load threshold
        this.corsProxyUrl = 'https://corsproxy.io/?';
        this.fallbackBumperUrl = 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/Sintel.mp4';
      }

      async selectStation(stationId) {
        const sessionId = ++this.currentSessionId;
        this.activeStationId = stationId;

        updateUIStatus("TUNING", `Tuning to Channel ${stationId}...`);

        // 1. Full Player & Hardware Pipeline Teardown
        this.teardown();

        // 2. Resolve Program Payload from EPG
        const programInfo = this.resolveEpgPayload(stationId);

        if (sessionId !== this.currentSessionId) return;

        if (!programInfo || !programInfo.mediaUrl) {
          console.warn(`[StreamController] No broadcast URL found for Channel ${stationId}. Triggering Off-Air.`);
          this.triggerOffAirFallback("NO_EPG_PAYLOAD", "Channel Off-Air / No Broadcast Signal");
          return;
        }

        updateNowPlayingDisplay(programInfo.title, "Live Wall-Clock Slot", stationId);

        // 3. HTTPS & CORS Proxy Sanitization
        const sanitizedUrl = this.sanitizeUrl(programInfo.mediaUrl);

        // 4. Start Buffer Watchdog & Bind Media Source
        updateUIStatus("BUFFERING", "AWAITING STREAM PACKETS...");
        this.startWatchdog(sessionId, stationId);

        if (Hls.isSupported() && (sanitizedUrl.includes('.m3u8') || sanitizedUrl.includes('m3u'))) {
          this.initHls(sanitizedUrl, sessionId);
        } else {
          this.initNative(sanitizedUrl, sessionId);
        }
      }

      teardown() {
        this.clearWatchdog();

        if (this.hls) {
          this.hls.off(Hls.Events.MEDIA_ATTACHED);
          this.hls.off(Hls.Events.MANIFEST_PARSED);
          this.hls.off(Hls.Events.ERROR);
          this.hls.stopLoad();
          this.hls.detachMedia();
          this.hls.destroy();
          this.hls = null;
        }

        if (this.video) {
          this.video.pause();
          this.video.removeAttribute('src');
          this.video.load(); // Clears browser buffer and memory pipeline
        }
      }

      sanitizeUrl(rawUrl) {
        let url = rawUrl.trim();
        // GitHub Pages HTTP mixed-content handling
        if (window.location.protocol === 'https:' && url.startsWith('http://')) {
          return `${this.corsProxyUrl}${encodeURIComponent(url)}`;
        }
        return url;
      }

      resolveEpgPayload(stationId) {
        const station = STATIONS[stationId];
        if (!station) return null;

        // Fall back to station default if program schedule is missing
        const activeProg = station.programs && station.programs.length > 0 
          ? station.programs[0] 
          : { title: station.name, mediaUrl: station.defaultStreamUrl };

        return {
          title: activeProg.title,
          mediaUrl: activeProg.mediaUrl || station.defaultStreamUrl
        };
      }

      initHls(url, sessionId) {
        this.hls = new Hls({
          enableWorker: true,
          lowLatencyMode: false,
          manifestLoadingTimeOut: 5000,
          manifestLoadingMaxRetry: 2
        });

        this.hls.loadSource(url);
        this.hls.attachMedia(this.video);

        this.hls.on(Hls.Events.MANIFEST_PARSED, () => {
          if (sessionId !== this.currentSessionId) return;
          this.clearWatchdog();
          this.video.play().then(() => {
            updateUIStatus("PLAYING", "LIVE BROADCAST");
          }).catch(err => {
            console.warn('[StreamController] Autoplay restricted by browser:', err);
            updateUIStatus("PAUSED", "CLICK UNMUTE / PLAY TO START");
          });
        });

        this.hls.on(Hls.Events.ERROR, (event, data) => {
          if (sessionId !== this.currentSessionId) return;

          if (data.fatal) {
            switch (data.type) {
              case Hls.ErrorTypes.NETWORK_ERROR:
                console.warn('[StreamController] Network error encountered. Re-attempting load...');
                this.hls.startLoad();
                break;
              case Hls.ErrorTypes.MEDIA_ERROR:
                console.warn('[StreamController] Media decoder issue. Attempting recovery...');
                this.hls.recoverMediaError();
                break;
              default:
                console.error('[StreamController] Unrecoverable stream failure:', data);
                this.triggerOffAirFallback("DEAD_STREAM", "Stream Signal Lost (404 / Offline)");
                break;
            }
          }
        });
      }

      initNative(url, sessionId) {
        this.video.src = url;

        const onCanPlay = () => {
          if (sessionId !== this.currentSessionId) return;
          this.clearWatchdog();
          this.video.play().then(() => {
            updateUIStatus("PLAYING", "LIVE BROADCAST");
          }).catch(() => {
            updateUIStatus("PAUSED", "CLICK UNMUTE / PLAY TO START");
          });
          this.video.removeEventListener('canplay', onCanPlay);
        };

        const onError = () => {
          if (sessionId !== this.currentSessionId) return;
          this.video.removeEventListener('error', onError);
          this.triggerOffAirFallback("MEDIA_ERROR", "Media Format Not Supported / Stream Down");
        };

        this.video.addEventListener('canplay', onCanPlay);
        this.video.addEventListener('error', onError);
        this.video.load();
      }

      startWatchdog(sessionId, stationId) {
        this.clearWatchdog();
        this.watchdogTimer = setTimeout(() => {
          if (sessionId === this.currentSessionId) {
            console.warn(`[StreamController] Stream load timed out for Station ${stationId}`);
            this.triggerOffAirFallback("BUFFER_TIMEOUT", "Station Unresponsive (Timeout)");
          }
        }, this.watchdogTimeoutMs);
      }

      clearWatchdog() {
        if (this.watchdogTimer) {
          clearTimeout(this.watchdogTimer);
          this.watchdogTimer = null;
        }
      }

      triggerOffAirFallback(reasonCode, userMessage) {
        this.teardown();
        updateUIStatus("OFF_AIR", userMessage || "STATION OFF AIR");
        updateNowPlayingDisplay("Off-Air Bumper / Interstitial Fill", "Fallback Program", this.activeStationId);

        // Load emergency off-air bumper clip
        this.video.src = this.fallbackBumperUrl;
        this.video.loop = true;
        this.video.play().catch(() => {});
      }
    }

    // Global Instances & UI Helpers
    const videoEl = document.getElementById('main-video-player');
    const controller = new StreamController(videoEl);

    function renderStationCards(activeStationId) {
      const container = document.getElementById('station-list');
      container.innerHTML = '';

      Object.values(STATIONS).forEach(station => {
        const isActive = station.id === activeStationId;
        const card = document.createElement('div');
        
        card.className = `p-4 rounded-xl border bg-slate-900 cursor-pointer transition-all duration-200 flex items-center justify-between hover:border-slate-700 ${
          isActive ? 'active-channel-card border-emerald-500 bg-slate-900/90' : 'border-slate-800'
        }`;

        card.onclick = () => {
          renderStationCards(station.id);
          controller.selectStation(station.id);
        };

        card.innerHTML = `
          <div class="flex items-center gap-3">
            <div class="w-3 h-3 rounded-full ${isActive ? 'bg-emerald-500 shadow-lg shadow-emerald-500/50' : 'bg-slate-700'}"></div>
            <div>
              <div class="font-bold text-sm text-slate-100">${station.name}</div>
              <div class="text-xs text-slate-400 font-mono">${station.tagline}</div>
            </div>
          </div>
          <div class="font-mono text-sm font-bold ${isActive ? 'text-emerald-400' : 'text-slate-500'}">
            CH ${station.id}
          </div>
        `;

        container.appendChild(card);
      });
    }

    function updateUIStatus(state, message) {
      const dot = document.getElementById('player-status-dot');
      const text = document.getElementById('player-status-text');

      text.textContent = message;

      switch (state) {
        case 'PLAYING':
          dot.className = 'w-2.5 h-2.5 rounded-full bg-emerald-500';
          break;
        case 'BUFFERING':
        case 'TUNING':
          dot.className = 'w-2.5 h-2.5 rounded-full bg-amber-500 animate-pulse';
          break;
        case 'OFF_AIR':
          dot.className = 'w-2.5 h-2.5 rounded-full bg-rose-500';
          break;
        default:
          dot.className = 'w-2.5 h-2.5 rounded-full bg-slate-500';
          break;
      }
    }

    function updateNowPlayingDisplay(title, timeStr, stationId) {
      document.getElementById('current-program-title').textContent = title;
      document.getElementById('current-program-time').textContent = timeStr;
      document.getElementById('current-channel-badge').textContent = `CH ${stationId}`;
    }

    function startClock() {
      const clockEl = document.getElementById('system-clock');
      setInterval(() => {
        const now = new Date();
        clockEl.textContent = now.toISOString().substr(11, 8) + ' UTC';
      }, 1000);
    }

    // Audio & Button Event Bindings
    document.getElementById('btn-mute').onclick = () => {
      videoEl.muted = !videoEl.muted;
      document.getElementById('btn-mute').textContent = videoEl.muted ? 'Unmute Audio' : 'Mute Audio';
    };

    document.getElementById('btn-reload').onclick = () => {
      if (controller.activeStationId) {
        controller.selectStation(controller.activeStationId);
      }
    };

    // Initialize Application with Channel 103 active by default
    window.addEventListener('DOMContentLoaded', () => {
      startClock();
      videoEl.muted = true; // Default muted for browser autoplay policies
      renderStationCards(103);
      controller.selectStation(103);
    });
  </script>
</body>
</html>
